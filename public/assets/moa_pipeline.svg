<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" font-family="ui-sans-serif, system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif">
  <style>
    text { dominant-baseline: middle; }
    .title { font-size: 18px; font-weight: 700; }
    .body { font-size: 15px; fill: #171717; }
    .muted { font-size: 13px; fill: #737373; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; }
    .pink-fg { fill: #db2777; }
    .blue-fg { fill: #2563eb; }
    .title-fg { fill: #db2777; }
    .on { fill: #db2777; font-weight: 700; }
    .off { fill: #a3a3a3; font-weight: 500; }
    .box { fill: #f5f5f5; stroke: #d4d4d4; stroke-width: 1; }
    .stroke-pink { fill: none; stroke: #f9a8d4; stroke-width: 1.5; }
    .stroke-blue { fill: none; stroke: #93c5fd; stroke-width: 1.5; }
    .fill-pink { fill: #fdf2f8; stroke: none; }
    .fill-blue { fill: #eff6ff; stroke: none; }
    .vote-bg { fill: #171717; }
    .vote-title { font-size: 17px; font-weight: 700; fill: #fb7185; }
    .vote-text { font-size: 14px; fill: #fafafa; }
    .line { fill: none; stroke: #737373; stroke-width: 1.2; }
    .arrow-fill { fill: #737373; }

    @media (prefers-color-scheme: dark) {
      .body { fill: #fafafa; }
      .muted { fill: #a3a3a3; }
      .box { fill: #262626; stroke: #525252; }
      .stroke-pink { stroke: #f472b6; }
      .stroke-blue { stroke: #60a5fa; }
      .fill-pink { fill: rgba(244,114,182,0.12); }
      .fill-blue { fill: rgba(96,165,250,0.12); }
      .vote-bg { fill: #fafafa; }
      .vote-title { fill: #be185d; }
      .vote-text { fill: #171717; }
      .line { stroke: #a3a3a3; }
      .arrow-fill { fill: #a3a3a3; }
      .pink-fg { fill: #f472b6; }
      .blue-fg { fill: #60a5fa; }
      .title-fg { fill: #f472b6; }
      .on { fill: #f472b6; }
      .off { fill: #737373; }
    }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fill"/>
    </marker>
  </defs>

  <text x="20" y="30" class="title title-fg">PIPELINE — 시스템 구조도</text>

  <rect x="280" y="60" width="140" height="40" rx="6" class="box"/>
  <text x="350" y="80" text-anchor="middle" class="body">지문 + 선택지</text>

  <line x1="350" y1="100" x2="350" y2="315" class="line" marker-end="url(#arrowhead)"/>

  <path d="M 420 80 H 480 V 135" class="line" marker-end="url(#arrowhead)"/>

  <rect x="450" y="140" width="230" height="120" rx="8" class="stroke-blue"/>
  <text x="465" y="160" class="label blue-fg">PROVIDER</text>
  <text x="465" y="182" class="body">skt/A.X-4.0-Light</text>

  <rect x="465" y="200" width="100" height="40" rx="4" class="fill-blue"/>
  <text x="515" y="220" text-anchor="middle" class="body">temp 0.3</text>

  <rect x="570" y="200" width="100" height="40" rx="4" class="fill-blue"/>
  <text x="620" y="220" text-anchor="middle" class="body">temp 0.7</text>

  <line x1="575" y1="260" x2="575" y2="315" class="line" marker-end="url(#arrowhead)"/>
  <text x="585" y="287" class="muted">풀이 힌트 2개</text>

  <rect x="40" y="320" width="620" height="215" rx="8" class="stroke-pink"/>
  <text x="56" y="343" class="label pink-fg">AGGREGATOR</text>
  <text x="56" y="368" class="body">EXAONE-4.0-32B</text>
  <text x="195" y="368" class="muted">· 3 모드 병렬 추론</text>

  <rect x="60" y="390" width="180" height="130" rx="6" class="fill-pink"/>
  <text x="150" y="418" text-anchor="middle" class="label pink-fg">MODE 1</text>
  <text x="150" y="452" text-anchor="middle" class="body">추론 <tspan class="off">OFF</tspan></text>
  <text x="150" y="484" text-anchor="middle" class="body">힌트 <tspan class="off">OFF</tspan></text>

  <rect x="260" y="390" width="180" height="130" rx="6" class="fill-pink"/>
  <text x="350" y="418" text-anchor="middle" class="label pink-fg">MODE 2</text>
  <text x="350" y="452" text-anchor="middle" class="body">추론 <tspan class="on">ON</tspan></text>
  <text x="350" y="484" text-anchor="middle" class="body">힌트 <tspan class="on">ON</tspan></text>

  <rect x="460" y="390" width="180" height="130" rx="6" class="fill-pink"/>
  <text x="550" y="418" text-anchor="middle" class="label pink-fg">MODE 3</text>
  <text x="550" y="452" text-anchor="middle" class="body">추론 <tspan class="on">ON</tspan></text>
  <text x="550" y="484" text-anchor="middle" class="body">힌트 <tspan class="off">OFF</tspan></text>

  <line x1="350" y1="535" x2="350" y2="590" class="line" marker-end="url(#arrowhead)"/>
  <text x="362" y="562" class="muted">답안 3개</text>

  <rect x="220" y="595" width="260" height="95" rx="8" class="vote-bg"/>
  <text x="350" y="622" text-anchor="middle" class="vote-title">다수결 (VOTE)</text>
  <text x="350" y="652" text-anchor="middle" class="vote-text">1:1:1 동점 시,</text>
  <text x="350" y="672" text-anchor="middle" class="vote-text">MODE 2 답안 선택</text>

  <line x1="350" y1="690" x2="350" y2="745" class="line" marker-end="url(#arrowhead)"/>

  <rect x="280" y="750" width="140" height="40" rx="6" class="box"/>
  <text x="350" y="770" text-anchor="middle" class="body">최종 답안</text>
</svg>
