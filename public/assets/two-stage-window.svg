<svg xmlns="http://www.w3.org/2000/svg" width="460" height="406" viewBox="0 0 460 406" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', sans-serif">
  <rect width="460" height="406" rx="16" fill="#16161e"/>

  <!-- Stage 1 panel -->
  <rect x="18" y="18" width="424" height="156" rx="14" fill="#1d1d27" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="34" y="46" font-size="12" font-weight="700" letter-spacing="1.5" fill="#e0356f">STAGE 1</text>
  <text x="34" y="70" font-size="17" font-weight="700" fill="#eaeaf2">후보 위치 탐색</text>

  <!-- full document track -->
  <rect x="34" y="92" width="392" height="28" rx="8" fill="#2c2c38"/>
  <!-- equal-width windows, woven up/down so the overlap shows -->
  <g stroke="#e0356f" stroke-opacity="0.7">
    <rect x="40" y="84" width="100" height="28" rx="6" fill="#e0356f" fill-opacity="0.5"/>
    <rect x="106" y="100" width="100" height="28" rx="6" fill="#e0356f" fill-opacity="0.5"/>
    <rect x="172" y="84" width="100" height="28" rx="6" fill="#e0356f" fill-opacity="0.5"/>
    <rect x="238" y="100" width="100" height="28" rx="6" fill="#e0356f" fill-opacity="0.5"/>
    <rect x="304" y="84" width="100" height="28" rx="6" fill="#e0356f" fill-opacity="0.5"/>
  </g>

  <text x="34" y="156" font-size="13" fill="#9a9fb0">&#8594; 모든 위치 후보 평가</text>

  <!-- arrow -->
  <line x1="230" y1="186" x2="230" y2="218" stroke="#5a5a68" stroke-width="3" stroke-linecap="round"/>
  <path d="M223 216 L230 226 L237 216 Z" fill="#5a5a68"/>

  <!-- Stage 2 panel -->
  <rect x="18" y="236" width="424" height="152" rx="14" fill="#1d1d27" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="34" y="264" font-size="12" font-weight="700" letter-spacing="1.5" fill="#e0356f">STAGE 2</text>
  <text x="34" y="288" font-size="17" font-weight="700" fill="#eaeaf2">후보 주변 재구성</text>

  <rect x="34" y="308" width="392" height="28" rx="8" fill="#2c2c38"/>
  <rect x="175" y="308" width="110" height="28" rx="6" fill="#e0356f"/>
  <circle cx="230" cy="322" r="6" fill="#ffffff"/>

  <text x="34" y="376" font-size="13" fill="#9a9fb0">&#8594; 정답 중심 윈도우 추출</text>
</svg>
